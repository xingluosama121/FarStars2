      card.status = payload.success ? "ok" : "fail";
      card._t1 = Date.now();
      card._ms = Math.max(0, card._t1 - (card._t0 || card._t1));
      var res = payload.result != null ? payload.result : item.result;
      if (res && typeof res === "object") {
        card.result = res.output != null ? String(res.output) : JSON.stringify(res, null, 2);
      } else {
        card.result = String(res == null ? "" : res);
      }
      if (S.sid === sid) updateBotDom(sess, botA);
      return;
    }
    case "on_tool_error": {
      var botE = liveBotFor(sid, payload.task_id || item.task_id);
      if (!botE) return;
      var lastT = findLast(botE.tools, function (x) { return x.status === "running"; });
      if (lastT) { lastT.status = "fail"; lastT.result = String(payload.error || ""); }
      if (S.sid === sid) updateBotDom(sess, botE);
      return;
    }
    case "on_task_done": {
      var botD = S.activeBot[sid];
      if (botD && (S.activeTask[sid] === (payload.task_id || item.task_id) || !payload.task_id)) {
        if (payload.content != null) {
          var doneText = String(payload.content);
          mergeFinalContent(botD, doneText);
          segContent(botD, doneText, false);
        }
        botD.status = "done";
        botD._newStep = true;
        finalizeBotStats(sess, botD, payload.stats || item.stats);
        delete S.activeTask[sid];
        delete S.activeBot[sid];
        finalizeMaybeAutoTitle(sess, botD);
        if (S.sid === sid) updateBotDom(sess, botD);
      }
      sess && (sess.running = false);
      renderSessions();
      updateStopBtn();
      return;
    }
    case "on_task_stopped": case "on_task_error": case "on_task_timeout": {
      var botS = S.activeBot[sid];
      if (botS) {
        botS.status = (type === "on_task_stopped") ? "stopped" : (type === "on_task_timeout" ? "timeout" : "error");
        botS.errText = String(payload.reason || payload.error || (payload.kind ? ("call_timeout") : ""));
        finalizeBotStats(sess, botS, payload.stats || item.stats);
        delete S.activeTask[sid];
        delete S.activeBot[sid];
        if (S.sid === sid) updateBotDom(sess, botS);
      }
      sess && (sess.running = false);
      renderSessions();
      updateStopBtn();
      return;
    }
    default:
      return;
  }
}

/* when the stream gives both delta chunks and a final aggregate, merge without duplication */
function mergeFinalContent(bot, text) {
  if (text == null) return;
  var cur = bot.content || "";
  if (!cur) { bot.content = text; return; }
  if (cur === text) return;
  if (cur.endsWith(text)) return;
  if (text.indexOf(cur) === 0) { bot.content = text; return; }
  if (cur.indexOf(text) >= 0) return;
  if (cur.endsWith(text.slice(0, Math.min(24, text.length))) && text.length <= 24) return;
  /* fallback: append (treated as a new segment) */
  bot.content = cur + text;
}

function finalizeMaybeAutoTitle(sess, bot) {
  /* 会话标题由服务端在首轮结束后用一次独立的模型调用自动总结，
     并通过 on_session_title 事件下发；此处不再本地截断写死标题。
     生成失败时服务端回退为首条消息的截断文本（见 WebUI._maybe_auto_title）。 */
  if (!sess) return;
  renderSessions();
}

/* ============================================================
   composer actions
   ============================================================ */
function updateStopBtn() {
  var sid = S.sid;
  var running = !!(sid && (S.activeTask[sid] || (S.sessions[sid] && S.sessions[sid].running)));
  var stopBtn = $("#btn-stop");
  stopBtn.classList.toggle("hidden", !running);
  $("#btn-send").classList.toggle("hidden", running);
  /* 任务结束（或切换会话）后清除"停止中"的禁用态 */
  if (!running) { stopBtn.disabled = false; stopBtn.dataset.stopping = ""; }
}
function sendMessage() {
  var input = $("#input");
  var text = (input.value || "").trim();
  if (!text && !S.pending.length) return;
  var savedPending = S.pending.slice();
  var attachments = savedPending.map(function (a) {
    return { name: a.name, type: a.type, data: a.dataURL };
  });
  var start = function (sid) {
    var sess = ensureSession(sid);
    var m = { kind: "user", content: text, seq: S.seq++, local: true, pending: true, atts: savedPending.slice() };
    sess.msgs.push(m);
    /* 发送消息时置顶会话列表（点击切换不再改变顺序） */
    touchOrder(sid);
    renderSessions();
    if (S.sid === sid) { appendMsgDom(sess, m); scrollBottom(true); }
    input.value = "";
    input.style.height = "auto";
    if (S.sid) { _drafts[S.sid] = ""; }
    clearPending();
    sess.awaited = (sess.awaited || 0) + 1;
    var payload = { prompt: text, session_id: sid };
    var thinkSel = $("#cc-think");
    if (thinkSel && thinkSel.value) payload.think_level = thinkSel.value;
    if (attachments.length) payload.attachments = attachments;
    api("POST", "/chat", payload).then(function (r) {
      if (!r || r.ok === false) throw new Error((r && r.error) || "submit failed");
      sess.running = true;
      renderSessions();
      updateStopBtn();
    }).catch(function (e) {
      sess.awaited = Math.max(0, (sess.awaited || 0) - 1);
      m.pending = false; m.error = true;
      /* restore attachments so the user can retry */
      S.pending = savedPending;
      renderAttachBar();
      toast(String(e.message || e), "err");
      if (S.sid === sess.id) renderAllMessages(sess.id);
    });
  };
  if (!S.sid) { newSession(true).then(function (sid) { if (sid) start(sid); }); }
  else { start(S.sid); }
}
function stopTask() {
  if (!S.sid) return;
  var sid = S.sid;
  var btn = $("#btn-stop");
  /* 立即反馈：禁用按钮避免重复点击，并提示"正在停止"；
     后端已改为在模型流式过程中即时中断（不再等本轮生成结束）。 */
  if (btn) { btn.disabled = true; btn.dataset.stopping = "1"; }
  toast(t("toast.stopping"), "ok");
  api("POST", "/stop", { session_id: sid }).then(function () {
    /* 真正结束后端会下发 on_task_stopped / on_task_done，UI 由事件驱动收尾 */
  }).catch(function (e) {
    if (btn) { btn.disabled = false; btn.dataset.stopping = ""; }
    toast(String(e.message || e), "err");
  });
}

/* ============================================================
   ask-user modal
   ============================================================ */
var askState = null;
function showAsk(item) {
  var kind = item.kind || "clarify";
  var isApproval = (kind === "approval");
  askState = { qid: item.question_id, sid: item.sid || S.sid || "", kind: kind };
  /* Markdown render: the agent is instructed to write questions in Markdown
     (### headings / lists); render with the shared md() so the
     dialog matches the chat bubbles instead of showing raw source. */
  $("#ask-question").innerHTML = md(item.question || "");
  /* Approval is a binary decision: hide the free-text box and turn the two
     buttons into reject/approve so the user cannot mistype a CLI-style "y/n"
     (e.g. "1", which the backend would read as a denial). A clarification
     (kind="clarify") keeps the text box. */
  var input = $("#ask-input");
  var okBtn = $("#ask-ok");
  var cancelBtn = $("#ask-cancel");
  if (input) { input.value = ""; input.style.display = isApproval ? "none" : ""; }
  if (okBtn) {
    var okKey = isApproval ? "ask.approve" : "common.confirm";
    okBtn.setAttribute("data-i18n", okKey);
    okBtn.textContent = t(okKey);
  }
  if (cancelBtn) {
    var cancelKey = isApproval ? "ask.reject" : "common.cancel";
    cancelBtn.setAttribute("data-i18n", cancelKey);
    cancelBtn.textContent = t(cancelKey);
  }
  var modal = $("#ask-modal");
  modal.classList.remove("hidden");
  setTimeout(function () {
    if (isApproval && okBtn) { okBtn.focus(); }
    else if (input) { input.focus(); }
  }, 60);
}
function answerAsk(answer) {
  if (!askState) return;
  var payload = { question_id: askState.qid, answer: answer, session_id: askState.sid };
  $("#ask-modal").classList.add("hidden");
  askState = null;
  api("POST", "/answer", payload).catch(function (e) { toast(String(e.message || e), "err"); });
}

/* ============================================================
   SSE connection
   ============================================================ */
function connectSSE() {
  if (S.sse) { try { S.sse.close(); } catch (e) {} S.sse = null; }
  setConn("wait", t("status.connecting"));
  var es = new EventSource("/events");
  S.sse = es;
  es.onopen = function () { setConn("ok"); };
  es.onerror = function () { setConn("off", t("status.offline")); };
  es.onmessage = function (ev) {
    if (!ev.data) return;
    var item;
    try { item = JSON.parse(ev.data); } catch (e) { return; }
    try { handleEvent(item); } catch (e) { console.error("event handling error", e, item); }
  };
}

/* ============================================================
   attachments (multimodal: collected locally, routed by the backend)
   ============================================================ */
var MM_LIMIT_MB = { image: 10, audio: 20, video: 32 };
/* 粘贴超过该字符数的纯文本 → 转为 txt 附件（避免大段文本塞进输入框被截断） */
var PASTE_FILE_THRESHOLD = 1024;
var _pasteSeq = 0;

function pickFiles() { $("#file-input").click(); }

/* 文本 → data:text/plain;base64（支持中文等多字节字符） */
function textToDataURL(text) {
  text = String(text == null ? "" : text);
  var b64 = "";
  try {
    if (typeof TextEncoder === "function") {
      var bytes = new TextEncoder().encode(text);
      var bin = "";
      for (var i = 0; i < bytes.length; i++) { bin += String.fromCharCode(bytes[i]); }
      b64 = btoa(bin);
    } else {
      b64 = btoa(unescape(encodeURIComponent(text)));
    }
  } catch (e) { b64 = ""; }
  return "data:text/plain;base64," + b64;
}

function pasteAttachmentName() {
  _pasteSeq += 1;
  return LANG === "zh_CN" ? ("粘贴的内容" + _pasteSeq) : ("Pasted content " + _pasteSeq);
}

/* 把一段粘贴文本登记为 txt 附件（不进入输入框） */
function addPastedText(text) {
  text = String(text == null ? "" : text);
  if (!text) return;
  S.pending.push({
    name: pasteAttachmentName(), type: "text/plain", kind: "text",
    dataURL: textToDataURL(text), pasted: true, text: text
  });
  renderAttachBar();
  toast(t("chat.paste_as_file"), "ok");
}

function fileKind(f) {
  var type = (f.type || "").toLowerCase();
  if (type.indexOf("image/") === 0) return "image";
  if (type.indexOf("audio/") === 0) return "audio";
  if (type.indexOf("video/") === 0) return "video";
  var ext = ((f.name || "").split(".").pop() || "").toLowerCase();
  if (["png", "jpg", "jpeg", "gif", "webp", "bmp", "svg", "ico", "tiff", "tif"].indexOf(ext) >= 0) return "image";
  if (["mp3", "wav", "m4a", "flac", "aac", "ogg", "opus", "weba", "amr"].indexOf(ext) >= 0) return "audio";
  if (["mp4", "m4v", "webm", "mov", "avi", "mkv", "flv", "wmv"].indexOf(ext) >= 0) return "video";
  return "text";
}

function kindIcon(kind) {
  if (kind === "audio") return SVG.audio;
  if (kind === "video") return SVG.video;
  return SVG.file;
}

function addFiles(fileList) {
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return;
  var jobs = [];
  files.forEach(function (f) {
    var kind = fileKind(f);
    var limitMb = MM_LIMIT_MB[kind] || 10;
    if (f.size > limitMb * 1024 * 1024) {
      toast(LANG === "zh_CN"
        ? (f.name + " 超过 " + limitMb + "MB 上限，已跳过")
        : (f.name + " exceeds " + limitMb + "MB, skipped"), "warn");
      return;
    }
    jobs.push(new Promise(function (resolve) {
      var rd = new FileReader();
      rd.onload = function () { resolve({ name: f.name, type: f.type || "", kind: kind, dataURL: String(rd.result || "") }); };
      rd.onerror = function () { resolve(null); };
      rd.readAsDataURL(f);
    }));
  });
  Promise.all(jobs).then(function (items) {
    var added = 0;
    items.forEach(function (it) { if (it) { S.pending.push(it); added++; } });
    renderAttachBar();
    if (added) toast(LANG === "zh_CN" ? "已添加附件" : "Attachments added", "ok");
  });
}

function renderAttachBar() {
  var bar = $("#attach-bar");
  if (!bar) return;
  if (!S.pending.length) { bar.classList.add("hidden"); bar.innerHTML = ""; return; }
  bar.classList.remove("hidden");
  bar.innerHTML = S.pending.map(function (a, i) {
    var inner = (a.kind === "image" && a.dataURL)
      ? '<img src="' + a.dataURL + '" alt="">'
      : '<span class="a-ic">' + kindIcon(a.kind) + "</span>";
    /* 粘贴转成的 txt 附件：保留「粘贴到文本输入框」按钮（转为直接编辑） */
    var pastein = a.pasted
      ? '<button class="a-pastein" data-paste-in="' + i + '" title="'
        + esc(t("chat.paste_to_input")) + '">' + esc(t("chat.paste_to_input")) + "</button>"
      : "";
    return '<span class="attach-chip">' + inner
      + '<span class="a-name">' + esc(a.name) + "</span>" + pastein
      + '<button class="a-rm" data-rm="' + i + '" title="remove">' + SVG.trash + "</button>"
      + "</span>";
  }).join("");
  $$("[data-rm]", bar).forEach(function (b) {
    b.addEventListener("click", function () {
      var i = parseInt(b.getAttribute("data-rm"), 10) || 0;
      S.pending.splice(i, 1);
      renderAttachBar();
    });
  });
  $$("[data-paste-in]", bar).forEach(function (b) {
    b.addEventListener("click", function () {
      var i = parseInt(b.getAttribute("data-paste-in"), 10) || 0;
      var a = S.pending[i];
      if (!a) return;
      var content = a.text || "";
      if (!content && a.dataURL) {
        try { content = decodeURIComponent(escape(atob(String(a.dataURL).split(",")[1] || ""))); }
        catch (e) { content = ""; }
      }
      S.pending.splice(i, 1);
      renderAttachBar();
      var inp = $("#input");
      if (inp) {
        insertAtCursor(inp, content);
        autosizeInput();
        if (S.sid) { _drafts[S.sid] = inp.value; }
      }
    });
  });
}

function clearPending() { S.pending = []; renderAttachBar(); }

/* drag & drop files anywhere on the page */
function initDropZone() {
  document.addEventListener("dragover", function (e) {
    if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0) {
      e.preventDefault();
    }
  });
  document.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      e.preventDefault();
      addFiles(e.dataTransfer.files);
    }
  });
}

function renderUserBubble(sess, m) {
  var atts = m.atts || [];
  var html = "";
  if (atts.length) {
    html += '<div class="msg-attach">' + atts.map(function (a) {
      if (a.kind === "image" && a.dataURL) {
        return '<img src="' + a.dataURL + '" alt="" title="' + esc(a.name) + '">';
      }
      return '<span class="attach-chip"><span class="a-ic">' + kindIcon(a.kind) + "</span>"
        + '<span class="a-name">' + esc(a.name) + "</span></span>";
    }).join("") + "</div>";
  }
  var text = esc(m.content || "");
  if (text) html += '<div class="bubble">' + text + "</div>";
  if (text) {
    html += '<div class="u-meta"><button class="copy-msg-btn" type="button" data-copy-msg'
      + ' data-sid="' + esc(sess ? sess.id : "") + '" data-seq="' + esc(String(m.seq)) + '"'
      + ' title="' + esc(t("chat.copy")) + '">' + SVG.copy
      + "<span>" + esc(t("chat.copy")) + "</span></button>"
      + '<button class="copy-msg-btn" type="button" data-edit'
      + ' data-sid="' + esc(sess ? sess.id : "") + '" data-seq="' + esc(String(m.seq)) + '"'
      + ' title="' + esc(t("chat.edit")) + '">' + SVG.edit
      + "<span>" + esc(t("chat.edit")) + "</span></button></div>";
  }
  return html;
}

      /* 界面语言：保存成功即全页切换（此前需刷新才生效，「设置不生效」观感来源） */
      S.cfg = Object.assign({}, S.cfg, { language: String(value) });
      setLang(String(value), false);
    }
    markSettingsApplied();
    SET_VALUES[key] = Object.assign({}, SET_VALUES[key], {
      value: value, explicit: true, source: "global"
    });
    updateDependentRows();
    refreshSettingsValues();
    syncComposerFromConfig();
    $("#btn-vision").classList.toggle("on", !!setEffective("mm.vision_enabled", false));
    if (key === "ui.language") { toast(t("settings.lang_switched"), "ok"); }
  };
  if (item.secret) {
    /* 密钥类：走既有加密配置链路（DPAPI），不经设置库 */
    var patch = {};
    patch[item.config_key || key] = value;
    api("POST", "/api/config", { config: patch })
      .then(function (r) { S.cfg = (r && r.config) || S.cfg; done(); })
      .catch(function (e) { fail(e.message || e); });
    return;
  }
  api("POST", "/api/settings/set", { key: key, value: value })
    .then(function (r) {
      if (r && r.ok === false) { fail(r.error); return; }
      done();
    })
    .catch(function (e) { fail(e.message || e); });
}
function updateDependentRows() {
  /* 总开关联动：重算每行置灰状态（不重绘整页，保持输入焦点） */
  $$("#settings-cards .set-row").forEach(function (row) {
    var key = row.getAttribute("data-set-row");
    var item = setItemByKey(key);
    if (!item) return;
    var unmet = setEnabledConditions(item);
    var off = unmet.length > 0 || !!item.greyed || !!item.locked;
    row.classList.toggle("is-disabled", off);
    $$("[data-set]", row).forEach(function (ctl) { ctl.disabled = off; });
  });
}
function refreshSettingsValues() {
  return api("GET", "/api/settings/values").then(function (r) {
    if (r && r.ok) SET_VALUES = r.values || {};
  }).catch(function () {});
}
function loadSettingsSchema(force) {
  if (SET_LOADED && !force) return Promise.resolve();
  if (SET_LOADING) return SET_LOADING;
  SET_LOAD_ERR = "";
  SET_LOADING = Promise.all([
    api("GET", "/api/settings/schema"),
    api("GET", "/api/settings/values")
  ]).then(function (res) {
    SET_SCHEMA = (res[0] && res[0].schema) || [];
    SET_VALUES = (res[1] && res[1].values) || {};
    SET_LOADED = true;
    SET_LOADING = null;
    /* 主题：首次拿到设置库后合并 ui.theme（跨设备）；本地有未落库改动则回写。 */
    if (!_themeBackendLoaded) { _themeBackendLoaded = true; themeLoadFromBackend(); }
    if (_themeDirty) themeFlushBackend();
    /* 界面语言：以设置库解析值为准（顶栏按钮与设置面板同源），避免启动时
       浏览器语言推断出的 LANG 与设置面板默认值不一致。 */
    var lrec = SET_VALUES ? SET_VALUES["ui.language"] : null;
    var lval = lrec && lrec.value;
    if ((lval === "zh_CN" || lval === "en") && lval !== LANG) { setLang(lval, false); }
    renderSettings();
    return null;
  }).catch(function (e) {
    SET_LOADING = null;
    SET_LOAD_ERR = String((e && e.message) || e || "load failed");
    renderSettings();
    toast(t("settings.load_failed"), "err");
    return null;
  });
  return SET_LOADING;
}
function markSettingsApplied() {
  var note = $("#settings-note");
  if (note) { note.textContent = t("settings.applied_note"); note.classList.add("ok"); }
}
function markSettingsClean() {

/* JSON 高级模式（框架 / 元框架视角）：批量编辑 + 差异应用 + 导入导出 */
function renderAdvanced(box) {
  var values = {};
  SET_SCHEMA.forEach(function (it) {
    if (it.secret) return;
    values[it.key] = setEffective(it.key, it.default);
  });
  var html = '<div class="card"><div class="card-head"><span>' + esc(t("adv.title")) + "</span>"
    + '<div class="spacer"></div>'
    + '<button class="btn btn-sm btn-plain" id="btn-adv-export">' + esc(t("adv.export")) + "</button>"
    + '<label class="btn btn-sm btn-plain" style="cursor:pointer">' + esc(t("adv.import"))
    + '<input type="file" id="adv-file-input" accept=".json" class="hidden"></label>'
    + '<button class="btn btn-sm btn-primary" id="btn-adv-apply">' + esc(t("adv.apply")) + "</button></div>"
    + '<div class="card-body"><div class="f-tip">' + esc(t("adv.desc")) + "</div>"
    + '<textarea class="form" id="adv-json" rows="16" spellcheck="false">'
    + esc(JSON.stringify(values, null, 2)) + "</textarea>"
    + '<div class="f-tip" id="adv-note"></div></div></div>';
  box.innerHTML = html;
  $("#btn-adv-apply").addEventListener("click", function () {
    var raw = $("#adv-json").value;
    var patch;
    try { patch = JSON.parse(raw); }
    catch (e) { toast(t("settings.bad_json") + ": " + e.message, "err"); return; }
    if (!patch || typeof patch !== "object") { toast(t("settings.bad_json"), "err"); return; }
    var keys = Object.keys(patch);
    var note = $("#adv-note");
    var applied = 0;
    var failed = [];
    var seq = Promise.resolve();
    keys.forEach(function (k) {
      seq = seq.then(function () {
        var item = setItemByKey(k);
        if (!item) { failed.push(k + " (unknown)"); return; }
        var req;
        if (item.secret) {
          var p = {};
          p[item.config_key || k] = patch[k];
          req = api("POST", "/api/config", { config: p });
        } else {
          req = api("POST", "/api/settings/set", { key: k, value: patch[k] });
        }
        return req.then(function (r) {
          if (r && r.ok === false) failed.push(k + ": " + (r.error || "failed"));
          else applied += 1;
        }).catch(function (e) { failed.push(k + ": " + (e.message || e)); });
      });
    });
    seq.then(function () {
      if (note) note.textContent = t("adv.result") + " ok=" + applied
        + (failed.length ? (" · failed=" + failed.length + " [" + failed.slice(0, 3).join("; ") + "]") : "");
      toast(t("adv.result") + " ok=" + applied
        + (failed.length ? (" / failed " + failed.length) : ""),
        failed.length ? "warn" : "ok");
      if (Object.prototype.hasOwnProperty.call(patch, "ui.language")
          && !failed.some(function (f) { return String(f).indexOf("ui.language") === 0; })) {
        S.cfg = Object.assign({}, S.cfg, { language: String(patch["ui.language"]) });
        setLang(String(patch["ui.language"]), false);
      }
      loadSettingsSchema(true);
      syncComposerFromConfig();
    });
  });
  $("#btn-adv-export").addEventListener("click", function () {
    window.open("/api/settings/export", "_blank");
  });
  var fi = $("#adv-file-input");
  if (fi) fi.addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(",").pop();
      api("POST", "/api/settings/import", { name: f.name, data: b64 }).then(function (r) {
        if (!r.ok) { toast(String(r.error || "import failed"), "err"); return; }
        toast(t("adv.imported") + " " + (r.imported || 0), "ok");
        loadSettingsSchema(true);
      }).catch(function (e) { toast(String(e.message || e), "err"); });
    };
    reader.readAsDataURL(f);
    this.value = "";
  });
}

/* ============================================================
   recovery view
   ============================================================ */
function recAction(action, payload, note) {
  api("POST", "/api/snapshots", { action: action, payload: payload || {} }).then(function (r) {
    if (r && r.ok === false) { toast(String(r.error || "failed"), "err"); return; }
    toast(note || "ok", "ok");
    loadRecovery();
    refreshSessions();
  }).catch(function (e) { toast(String(e.message || e), "err"); });
}
/* 快照展示排序：last good（已标记正常）置顶；同组内按时间倒序（最新在上） */
function sortSnapshots(items) {
  return (items || []).slice().sort(function (a, b) {
    var ga = (a.is_last_good || a.good) ? 0 : 1;
    var gb = (b.is_last_good || b.good) ? 0 : 1;
    if (ga !== gb) return ga - gb;
    return (b.created_at || 0) - (a.created_at || 0);
  });
}
function updateRecBatchBar() {
  var bar = $("#rec-batch-bar");
  if (!bar) return;
  bar.classList.toggle("hidden", !S.recBatch);
  var n = 0;
  Object.keys(S.recSel || {}).forEach(function (k) { if (S.recSel[k]) n += 1; });
  var cnt = $("#rec-sel-count");
  if (cnt) cnt.textContent = n + " " + t("rec.selected_n");
}
function toggleRecBatch(force) {
  S.recBatch = (force === undefined) ? !S.recBatch : !!force;
  if (!S.recBatch) S.recSel = {};
  loadRecovery();
}
function recDeleteSelected() {
  var ids = Object.keys(S.recSel || {}).filter(function (k) { return S.recSel[k]; });
  if (!ids.length) { toast(t("rec.batch_hint"), "warn"); return; }
  confirmDialog(t("rec.confirm_del") + " (" + ids.length + ")?", function () {
    api("POST", "/api/snapshots", { action: "delete_many", payload: { ids: ids } }).then(function (r) {
      if (r && r.ok === false) { toast(String(r.error || "failed"), "err"); return; }
      var n = (r && r.count) || ids.length;
      S.recSel = {};
      S.recBatch = false;
      toast(t("rec.deleted_n") + " (" + n + ")", "ok");
      loadRecovery();
    }).catch(function (e) { toast(String(e.message || e), "err"); });
  });
}
function loadRecovery() {
  var box = $("#rec-list");
  if (!box) return;
  api("GET", "/api/snapshots").then(function (r) {
    var items = sortSnapshots((r && r.items) || []);
    if (!items.length) {
      box.innerHTML = '<div class="empty-note">' + esc(t("rec.empty")) + "</div>";
      updateRecBatchBar();
      return;
    }
    var html = items.map(function (it) {
      var badges = "";
      if (it.is_current) badges += '<span class="badge cur">current</span> ';
      if (it.is_last_good || it.good) badges += '<span class="badge good">last-good</span> ';
      if (it.tag && it.tag !== "baseline") badges += '<span class="badge tag">' + esc(it.tag) + "</span> ";
      var check = S.recBatch
        ? '<input type="checkbox" class="r-check" data-rec-check="' + esc(it.id) + '"'
          + ((S.recSel || {})[it.id] ? " checked" : "") + ">"
        : "";
      var actions = S.recBatch ? "" :
        ('<button class="btn btn-sm btn-ghost" data-rec-rollback="' + esc(it.id) + '">' + esc(t("rec.rollback")) + "</button>"
          + '<button class="btn btn-sm btn-plain" data-rec-good="' + esc(it.id) + '">' + esc(t("rec.markgood")) + "</button>");
      return '<div class="rec-item' + (it.is_current ? " current" : "") + '">'
        + check
        + '<div class="r-main"><div class="r-desc">' + esc(it.description || it.id) + "</div>"
        + '<div class="r-meta">' + esc(it.id) + " · " + esc(fmtTs(it.created_at)) + "</div></div>"
        + badges
        + actions
        + "</div>";
    }).join("");
    box.innerHTML = html;
    $$("[data-rec-rollback]", box).forEach(function (b) {
      b.addEventListener("click", function () { recAction("rollback", { id: b.getAttribute("data-rec-rollback") }, t("toast.rollback_done")); });
    });
    $$("[data-rec-good]", box).forEach(function (b) {
      b.addEventListener("click", function () { recAction("mark_good", { id: b.getAttribute("data-rec-good") }, t("toast.markgood_done")); });
    });
    $$("[data-rec-check]", box).forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-rec-check");
        S.recSel = S.recSel || {};
        S.recSel[id] = !!cb.checked;
        updateRecBatchBar();
      });
    });
    /* 批量模式下点击整行 = 切换勾选 */
    box.onclick = function (e) {
      if (!S.recBatch) return;
      var item = e.target.closest ? e.target.closest(".rec-item") : null;
      if (!item) return;
      var cb = item.querySelector("[data-rec-check]");
      if (cb && e.target !== cb) {
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event("change", { bubbles: true }));
      }
    };
    updateRecBatchBar();
  }).catch(function (e) {
    box.innerHTML = '<div class="empty-note">' + esc(String(e.message || e)) + "</div>";
    updateRecBatchBar();
  });
}

/* ============================================================
   plugins view
   ============================================================ */
function loadPlugins() {
  var box = $("#plugins-list");
  if (!box) return;
  Promise.all([
    api("GET", "/api/plugins").catch(function () { return {}; }),
    api("GET", "/api/plugins/dirs").catch(function () { return {}; })
  ]).then(function (res) {
    var plugins = (res[0] && res[0].plugins) || [];
    var dirs = (res[1] && res[1].dirs) || [];
    if (!plugins.length) {
      box.innerHTML = '<div class="empty-note">' + esc(t("plugins.empty")) + "</div>";
    } else {
      box.innerHTML = plugins.map(function (p) {
        var meta = [];
        if (p.version) meta.push("v" + p.version);
        if (p.publisher) meta.push(p.publisher);
        var tn = (p.tool_count != null) ? p.tool_count : (p.tools || []).length;
        var hn = (p.hook_count != null) ? p.hook_count : (p.hook_names || []).length;
        if (tn) meta.push(tn + " tools");
        if (hn) meta.push(hn + " hooks");
        if (p.signature_status) meta.push("sig:" + p.signature_status);
        if (p.isolation) meta.push(p.isolation);
        var state, cls;
        if (p.enabled === false) { state = t("plugins.failed_badge"); cls = "cur"; }
        else if (p.disabled_in_config) { state = t("plugins.disabled_badge"); cls = "warn"; }
        else { state = t("plugins.ok_badge"); cls = "good"; }
        var warn = "";
        if (p.error) {
          warn += '<div class="p-warn">' + esc(String(p.error).split("\n")[0].slice(0, 240)) + "</div>";
        }
        if (p.warnings && p.warnings.length) {
          warn += '<div class="p-warn">' + esc(String(p.warnings[0]).slice(0, 240)) + "</div>";
        }
        var actions = '<div class="p-actions">'
          + '<button class="btn btn-sm btn-plain" data-pl-toggle="' + esc(p.name) + '" data-pl-enable="' + (p.disabled_in_config ? "1" : "0") + '">'
          + esc(p.disabled_in_config ? t("plugins.enable") : t("plugins.disable")) + "</button>"
          + '<button class="btn btn-sm btn-ghost" data-pl-remove="' + esc(p.name) + '">' + esc(t("plugins.remove")) + "</button>"
          + "</div>";
        return '<div class="plugin-item">'
          + '<div class="p-main"><div class="p-name">' + esc(p.name) + "</div>"
          + '<div class="p-desc">' + esc(p.description || "") + (meta.length ? " · " + esc(meta.join(" · ")) : "") + "</div>"
          + warn + "</div>"
          + '<span class="badge ' + cls + '">' + esc(state) + "</span>"
          + actions
          + "</div>";
      }).join("");
      $$("[data-pl-toggle]", box).forEach(function (b) {
        b.addEventListener("click", function () {
          var enable = b.getAttribute("data-pl-enable") === "1";
          api("POST", "/api/plugins/toggle", { name: b.getAttribute("data-pl-toggle"), enabled: enable })
            .then(function () { loadPlugins(); })
            .catch(function (e) { toast(String(e.message || e), "err"); });
        });
      });
      $$("[data-pl-remove]", box).forEach(function (b) {
        b.addEventListener("click", function () {
          var name = b.getAttribute("data-pl-remove");
          confirmDialog(t("plugins.confirm_remove"), function () {
            api("POST", "/api/plugins/remove", { name: name })
              .then(function (r) {
                if (r && r.ok === false) { toast(String(r.error || "uninstall failed"), "err"); return; }
                loadPlugins();
              })
              .catch(function (e) { toast(String(e.message || e), "err"); });
          });
        });
      });
    }
    var dbox = $("#plugin-dirs");
    if (dbox) {
      if (!dirs.length) { dbox.innerHTML = '<div class="empty-note">—</div>'; }
      else {
        dbox.innerHTML = dirs.map(function (d) {
          return '<span class="dir-chip">' + esc(d) + '<button data-dir-remove="' + esc(d) + '">' + SVG.trash + "</button></span>";
        }).join("");
        $$("[data-dir-remove]", dbox).forEach(function (b) {
          b.addEventListener("click", function () {
            var p = b.getAttribute("data-dir-remove");
            api("DELETE", "/api/plugins/dirs", { path: p }).then(function () { loadPlugins(); })
              .catch(function (e) { toast(String(e.message || e), "err"); });
          });
        });
      }
    }
  });
}
function reloadPlugins() {
  api("POST", "/api/plugins/reload", {}).then(function (r) {
    toast(t("toast.plugins_reloaded"), "ok");

function uploadPlugin() {

/* ============================================================
   confirm dialog
   ============================================================ */
function confirmDialog(text, onOk) {
  var mask = document.createElement("div");
  mask.className = "modal-mask";
  mask.innerHTML = '<div class="modal"><div class="modal-body" style="padding-top:14px;"><p>' + esc(text) + "</p></div>"
    + '<div class="modal-foot"><button class="btn btn-plain" data-c="0">' + esc(t("common.cancel")) + "</button>"
    + '<button class="btn btn-primary" data-c="1">' + esc(t("common.confirm")) + "</button></div></div>";
  document.body.appendChild(mask);
  mask.addEventListener("click", function (e) {
    var c = e.target && e.target.getAttribute ? e.target.getAttribute("data-c") : null;
    if (c === "1") { mask.remove(); onOk(); }
    else if (c === "0" || e.target === mask) { mask.remove(); }
  });
}

function autosizeInput() {

/* 在光标处插入文本（Ctrl+Enter 换行手势用） */
function insertAtCursor(el, text) {
  var start = (el.selectionStart == null) ? el.value.length : el.selectionStart;
  var end = (el.selectionEnd == null) ? el.value.length : el.selectionEnd;
  el.value = el.value.slice(0, start) + text + el.value.slice(end);
  var pos = start + String(text).length;
  el.selectionStart = el.selectionEnd = pos;
}

    }
  });

    + '<button class="btn btn-sm btn-plain" id="btn-evo-export">' + esc(t("evo.export")) + "</button>"

          return '<div class="evo-row" title="' + esc(title + " · " + (p.target || "")) + '">'

            + esc(b.point) + '">' + esc(t("evo.resume")) + "</button></span>";
        }
        return '<span class="b-chip">' + esc(b.point) + " ok</span>";
      }).join(" ");
      $$("[data-breaker-resume]", bbox).forEach(function (btn) {

            .then(function () { toast(t("evo.resume") + " ok", "ok"); renderEvolution(); })
            .catch(function (e) { toast(String(e.message || e), "err"); });

      .catch(function (e2) { toast(String(e2.message || e2), "err"); });

  if (rf) { rf.addEventListener("click", renderEvolution); }
  var im = $("#btn-evo-import");

  if (im && fi) {
    im.addEventListener("click", function () { fi.click(); });

      var f = this.files && this.files[0];

          var rep = (rr && rr.report) || {};

          renderEvolution();
        }).catch(function (e) { toast(String(e.message || e), "err"); });
      };
      reader.readAsDataURL(f);
      this.value = "";
    });
  }
}

/* ============================================================
   console view (topology / tasks / audit / logs) — white-box runtime view
   ============================================================ */
function consoleBase() {
  var el = $("#console-base");
  var def = "http://127.0.0.1:" + ((S.cfg && S.cfg.cnb_port) || 17800);
  var saved = null;
  try { saved = localStorage.getItem("np_cnb_base"); } catch (e) {}
  if (el && !el.value) { el.value = saved || def; }
  return (el && el.value.trim()) || saved || def;
}
function renderConsole() {
  var body = $("#console-body");
  if (!body) { return; }
  var act = $("#console-tabs .ctab.active");
  var tab = act ? act.getAttribute("data-tab") : "whitebox";
  if (tab === "whitebox") { renderWhitebox(body); return; }
  if (tab === "proposals") { renderProposals(body); return; }
  var base = consoleBase();
  if (tab === "topo" || tab === "audit") {
    body.innerHTML = '<div class="empty-note">…</div>';
    var req = tab === "topo" ? { op: "topo" } : { op: "audit", n: 100 };
    api("POST", "/api/cnb/ctrl?base=" + encodeURIComponent(base), req).then(function (r) {
      var res = r || {};
      if (tab === "topo") {
        var tree = res.tree || "";
        var nodes = res.nodes || [];
        var html = '<div class="console-body"><pre>' + esc(tree || "(empty)") + "</pre>";
        if (nodes.length) {
          html += '<div style="margin-top:10px;">';
          nodes.forEach(function (n) {
            html += '<div class="crow"><span class="c-ts">L' + esc(n.level) + '</span>'
              + '<span class="c-main">' + esc((n.id || n.node_id || "") + " · " + (n.kind || "")) + "</span>"
              + '<span class="c-tag">' + esc(n.status || "") + "</span></div>";
          });
          html += "</div>";
        }
        body.innerHTML = html + "</div>";
      } else {
        var rows = res.audit || [];
        if (!rows.length) { body.innerHTML = '<div class="empty-note">' + esc(t("console.empty")) + "</div>"; return; }
        var html2 = "";
        rows.slice(-100).reverse().forEach(function (a) {
          var ts = a.ts ? new Date(a.ts * 1000).toLocaleTimeString() : "";
          html2 += '<div class="crow"><span class="c-ts">' + esc(ts) + '</span>'
            + '<span class="c-main">' + esc(a.msg || JSON.stringify(a)) + "</span></div>";
        });
        body.innerHTML = html2;
      }
    }).catch(function () {
      body.innerHTML = '<div class="empty-note">' + esc(t("console.unreachable")) + "</div>";
    });
    return;
  }
  if (tab === "tasks") {
    api("GET", "/api/status").then(function (r) {
      var tasks = (r && r.tasks) || [];
      if (!tasks.length) { body.innerHTML = '<div class="empty-note">' + esc(t("console.empty")) + "</div>"; return; }
      var html = "";
      tasks.slice(-30).reverse().forEach(function (tk) {
        html += '<div class="crow"><span class="c-ts">' + esc(tk.task_id || tk.id || "") + '</span>'
          + '<span class="c-main">' + esc((tk.status || "") + " · " + (tk.prompt || "")) + "</span></div>";
      });
      body.innerHTML = html;
    }).catch(function () { body.innerHTML = '<div class="empty-note">' + esc(t("console.empty")) + "</div>"; });
    return;
  }
  Promise.all([
    api("GET", "/api/debug").catch(function () { return {}; }),
    api("GET", "/api/evolution/log?n=40").catch(function () { return {}; })
  ]).then(function (res) {
    var dbg = res[0] || {};
    var evo = (res[1] && res[1].log) || [];
    var html = '<div class="console-body"><pre>' + esc(JSON.stringify(dbg, null, 2)) + "</pre>";
    if (evo.length) {
      html += '<div style="margin-top:10px;">';
      evo.slice().reverse().forEach(function (e) {
        var ts = e.ts ? new Date(e.ts * 1000).toLocaleTimeString() : "";
        var what = e.path || e.bundle || e.command || e.entry || "";
        html += '<div class="crow"><span class="c-ts">' + esc(ts) + '</span>'
          + '<span class="c-main">' + esc((e.event || "") + " " + what) + "</span></div>";
      });
      html += "</div>";
    }
    body.innerHTML = html + "</div>";
  });
}
/* 白盒总览（§4）：环境树 —— 装配了什么 / 怎么换 / 设置项 / 审计 */
function renderWhitebox(body) {
  body.innerHTML = '<div class="empty-note">…</div>';
  api("GET", "/api/whitebox/overview").then(function (tree) {
    var html = '<div class="console-body"><div class="f-tip" style="margin-bottom:6px;">'
      + esc(t("console.wb.hint")) + "</div>";
    (tree.sections || []).forEach(function (sec) {
      html += '<div class="wb-sec"><div class="wb-sec-h">' + esc(sec.title || sec.section)
        + (sec.error ? (' <span class="a-fail">(' + esc(sec.error) + ")</span>") : "") + "</div>";
      var envs = sec.envs || [];
      if (!envs.length) html += '<div class="empty-note">—</div>';
      envs.forEach(function (e) {
        var d = e.describe || {};
        var kv = Object.keys(d).map(function (k) {
          var v = d[k];
          if (v && typeof v === "object") v = JSON.stringify(v);
          return k + "=" + v;
        }).join(" ");
        html += '<div class="crow wb-row"><span class="c-main">' + esc(e.name || "")
          + '</span><span class="c-tag">' + esc(e.kind || "") + "</span>"
          + (e.change ? '<span class="c-sub">' + esc(e.change) + "</span>" : "")
          + '<div class="c-sub dim">' + esc(String(kv).slice(0, 420)) + "</div></div>";
      });
      var audit = sec.audit || [];
      if (audit.length) {
        html += '<div class="wb-audit"><b>audit:</b> ' + esc(String(audit.length)) + " · "
          + audit.slice(-3).map(function (a) {
            return esc(String(a.msg || a.event || JSON.stringify(a)).slice(0, 120));
          }).join(" / ") + "</div>";
      }
      html += "</div>";
    });
    body.innerHTML = html + "</div>";
  }).catch(function () {
    body.innerHTML = '<div class="empty-note">' + esc(t("console.unreachable")) + "</div>";
  });
}
/* 提案中心（§7.1）：待批卡片 / 全程列表 / 熔断 / 记忆与技能反思入口 */
function renderProposals(body) {
  body.innerHTML = '<div class="empty-note">…</div>';
  api("GET", "/api/evolution/proposals").then(function (d) {
    var html = '<div class="console-body">';

/* ============================================================
   composer controls / workspace picker / session batch / perspective

function patchConfig(patch, okMsg) {
  return api("POST", "/api/config", { config: patch }).then(function (r) {
    S.cfg = (r && r.config) || Object.assign({}, S.cfg, patch);
    if (okMsg) toast(okMsg, "ok");
    syncComposerFromConfig();
    return S.cfg;
  }).catch(function (e) { toast(String(e.message || e), "err"); });
}
/* 工作区输入框：始终反映"实际生效"的工作区。
   会话未单独设置时，后端会回退到全局 project_root（见 web.py 优先级），
   此时用继承态（斜体 + 全局路径作为占位）显示，避免只留一个空洞的 "…"。 */
function refreshWorkspaceField() {
  var ws = $("#cc-workspace");
  if (!ws) return;
  var _cs = S.sid ? S.sessions[S.sid] : null;
  var own = (_cs && _cs.workspace) || "";
  var globalRoot = (S.cfg && S.cfg.project_root) || "";
  if (document.activeElement !== ws) ws.value = own;
  if (own) {
    ws.classList.remove("ws-inherited");
    ws.title = t("chat.workspace");
    ws.placeholder = "";
  } else {
    ws.classList.add("ws-inherited");
    ws.title = t("chat.workspace.inherit") + (globalRoot ? "：" + globalRoot : "");
    ws.placeholder = globalRoot || t("chat.workspace.ph");
  }
}
/* 输入框内联控制：模式 / 模型名 / 工作区（直接改，直接生效） */
function syncComposerFromConfig() {
  var ps = $("#cc-preset");
  if (ps && document.activeElement !== ps) {
    var cur = (S.cfg && S.cfg.preset_name) || "";
    var opts = '<option value="">— ' + esc(t("src.default")) + " —</option>";
    (S.presets || []).forEach(function (p) {
      opts += '<option value="' + esc(p.name) + '"' + (p.name === cur ? " selected" : "") + ">"
        + esc(p.name + " · " + (p.mode || "")) + "</option>";
    });
    ps.innerHTML = opts;
    ps.value = cur;
  }
  var md = $("#cc-model");
  if (md && document.activeElement !== md) {
    refreshModelOptions();
    md.value = (S.cfg && S.cfg.model) || "";
  }
  /* 推理强度（思考强度）：off / low / medium / high / max；兼容旧版远星控制台写入的中文值 */
  var th = $("#cc-think");
  if (th && document.activeElement !== th) {
    var curTh = (S.cfg && S.cfg.think_level) || "high";
    var legacyTh = { "关": "off", "低": "low", "中": "medium", "高": "max", "xhigh": "max" };
    if (legacyTh[curTh]) curTh = legacyTh[curTh];
    var thOpts = ["off", "low", "medium", "high", "max"];
    var thHtml = "";
    thOpts.forEach(function (o) {
      thHtml += '<option value="' + o + '"' + (o === curTh ? " selected" : "") + ">"
        + esc(enumLabel("model.think_level", o)) + "</option>";
    });
    if (thOpts.indexOf(curTh) < 0) {
      thHtml = '<option value="' + esc(curTh) + '" selected>' + esc(curTh) + "</option>" + thHtml;
    }
    th.innerHTML = thHtml;
    th.value = curTh;
  }
  refreshWorkspaceField();
  /* 联网搜索开关状态（配置驱动，刷新后保持） */
  var wb = $("#btn-websearch");
  if (wb) wb.classList.toggle("on", !!(S.cfg && S.cfg.enable_web_search));
}
/* 每会话独立工作区：把输入栏选中的目录写入「当前会话」（不再改全局 project_root） */
function applySessionWorkspace(p) {
  if (!S.sid) { toast(t("chat.no_sessions"), "warn"); return; }
  var sess = S.sessions[S.sid];
  if (sess) sess.workspace = p;
  refreshWorkspaceField();
  api("POST", "/api/sessions/" + encodeURIComponent(S.sid) + "/workspace", { workspace: p })
    .then(function () { toast(t("settings.applied"), "ok"); refreshWorkspaceField(); })
    .catch(function (e) { toast(String(e.message || e), "err"); });
}
function setupComposerControls() {
  var ps = $("#cc-preset");
  if (ps) ps.addEventListener("change", function () {
    patchConfig({ preset_name: ps.value }, t("settings.applied"));
  });
  var md = $("#cc-model");
  if (md) md.addEventListener("change", function () {
    patchConfig({ model: md.value.trim() }, t("settings.applied"));
  });

    patchConfig({ think_level: th.value }, t("settings.applied"));

  if (wb) wb.addEventListener("click", function () {
    var next = !(S.cfg && S.cfg.enable_web_search);
    api("POST", "/api/config", { config: { enable_web_search: next } }).then(function (r) {
      S.cfg = (r && r.config) || Object.assign({}, S.cfg, { enable_web_search: next });
      syncComposerFromConfig();
      toast(next ? t("chat.websearch_on") : t("chat.websearch_off"), next ? "ok" : "warn");
    }).catch(function (e) { toast(String(e.message || e), "err"); });
  });

  syncComposerFromConfig();

/* 单会话系统提示词：按钮指示 + 状态同步 + 编辑弹窗 ---------------------------- */
function syncSessionPromptBtn() {
  var btn = $("#btn-sysprompt");
  if (!btn) return;
  var sess = S.sid ? S.sessions[S.sid] : null;
  var st = sess ? sess.sysPromptState : null;
  var has = !!(st && String(st.prompt || "").trim());
  btn.classList.toggle("on", has);

  if (dot) dot.classList.toggle("hidden", !has);

/* 拉取某会话的提示词状态（切会话时调用，用于点亮按钮指示） */
function refreshSessionPrompt(sid) {
  if (!sid) { syncSessionPromptBtn(); return; }
  api("GET", "/api/sessions/" + encodeURIComponent(sid) + "/system_prompt")
    .then(function (r) {
      var sess = ensureSession(sid);
      sess.sysPromptState = r || {};
      if (S.sid === sid) syncSessionPromptBtn();
    }).catch(function () {
      var sess = ensureSession(sid);
      sess.sysPromptState = null;
      if (S.sid === sid) syncSessionPromptBtn();
    });
}
function openSessionPromptDialog() {
  if (!S.sid) { toast(t("chat.sysprompt.nosession"), "warn"); return; }
  var sid = S.sid;
  var sess = ensureSession(sid);
  var st = sess.sysPromptState || {};
  var mode = (st.mode === "replace") ? "replace" : "append";
  var mask = document.createElement("div");
  mask.className = "modal-mask";
  var globalText = String(st.global_prompt || "");
  var modeHtml = ""
    + '<label class="sp-mode' + (mode === "append" ? " active" : "") + '">'
    + '<input type="radio" name="sp-mode" value="append"' + (mode === "append" ? " checked" : "") + ">"
    + "<span>" + esc(t("chat.sysprompt.append")) + "</span></label>"
    + '<label class="sp-mode' + (mode === "replace" ? " active" : "") + '">'
    + '<input type="radio" name="sp-mode" value="replace"' + (mode === "replace" ? " checked" : "") + ">"
    + "<span>" + esc(t("chat.sysprompt.replace")) + "</span></label>";
  mask.innerHTML =
    '<div class="modal wide dlg"><div class="modal-head"><span>'
    + esc(t("chat.sysprompt.title")) + "</span></div>"
    + '<div class="modal-body">'
    + '<p class="sp-hint">' + esc(t("chat.sysprompt.desc")) + "</p>"
    + '<div id="sp-global-wrap"' + (mode === "replace" ? ' style="display:none"' : "") + ">"
    + '<div class="sp-hint">' + esc(t("chat.sysprompt.global")) + "</div>"
    + '<textarea class="sp-textarea sp-global-ta" id="sp-global-text" placeholder="'
    + esc(t("chat.sysprompt.ph")) + '">' + esc(globalText) + "</textarea>"
    + "</div>"
    + '<div class="sp-hint">' + esc(t("chat.sysprompt.session")) + "</div>"
    + '<textarea class="sp-textarea" id="sp-text" placeholder="'
    + esc(t("chat.sysprompt.ph")) + '">' + esc(st.prompt || "") + "</textarea>"
    + '<div class="sp-hint">' + esc(t("chat.sysprompt.mode")) + "</div>"
    + '<div class="sp-modes" id="sp-modes">' + modeHtml + "</div>"
    + "</div>"
    + '<div class="modal-foot">'
    + '<button class="btn btn-plain" id="sp-clear">' + esc(t("chat.sysprompt.clear")) + "</button>"
    + '<div class="spacer"></div>'
    + '<button class="btn btn-plain" id="sp-cancel">' + esc(t("common.cancel")) + "</button>"
    + '<button class="btn btn-primary" id="sp-save">' + esc(t("chat.sysprompt.save")) + "</button>"
    + "</div></div>";
  document.body.appendChild(mask);
  var close = function () { if (mask.parentNode) mask.parentNode.removeChild(mask); };
  var selMode = function () {
    var el = mask.querySelector('input[name="sp-mode"]:checked');
    return el ? el.value : "append";
  };
  var updateGlobal = function (m) {
    var wrap = mask.querySelector("#sp-global-wrap");
    if (wrap) wrap.style.display = (m === "replace") ? "none" : "";
  };
  $$("#sp-modes .sp-mode").forEach(function (lb) {
    lb.addEventListener("click", function () {
      $$("#sp-modes .sp-mode").forEach(function (x) { x.classList.remove("active"); });
      lb.classList.add("active");
      var inp = lb.querySelector('input[name="sp-mode"]');
      if (inp) inp.checked = true;
      updateGlobal(inp ? inp.value : "append");
    });
  });
  var commit = function (text, done, includeGlobal) {
    var gbox = $("#sp-global-text");
    var newGlobal = gbox ? String(gbox.value || "") : globalText;
    var saveGlobal = (includeGlobal !== false && newGlobal !== globalText)
      ? api("POST", "/api/system_prompt/global", { prompt: newGlobal })
          .then(function (r) {
            globalText = (r && r.global_prompt !== undefined)
              ? String(r.global_prompt) : newGlobal;
            if (S.cfg) {
              S.cfg.custom_system_prompt = newGlobal;
              S.cfg.custom_system_prompt_enabled = !!newGlobal.trim();
            }
          })
      : Promise.resolve();
    saveGlobal.then(function () {
      return api("POST", "/api/sessions/" + encodeURIComponent(sid) + "/system_prompt",
          { prompt: text, mode: selMode() });
    }).then(function () {
      sess.sysPromptState = {
        prompt: text, mode: selMode(),
        global_prompt: globalText
      };
      syncSessionPromptBtn();
      close();
      toast(done, "ok");
    }).catch(function (e) { toast(String(e.message || e), "err"); });
  };
  $("#sp-save").addEventListener("click", function () {
    commit(($("#sp-text") || {}).value || "", t("chat.sysprompt.saved"), true);
  });
  $("#sp-clear").addEventListener("click", function () {
    commit("", t("chat.sysprompt.cleared"), false);
  });
  $("#sp-cancel").addEventListener("click", close);
  mask.addEventListener("click", function (e) { if (e.target === mask) close(); });
}
/* 目录选择器（浏览器端目录窗口；配合 /api/fs/list 只读列举） */
function openDirPicker(onPick) {

  mask.className = "modal-mask";
  var start = ($("#cc-workspace") && $("#cc-workspace").value)
    || ((S.cfg && S.cfg.project_root) || "");

      (r.drives || []).forEach(function (d) {

    var p = state.path || "";
    mask.remove();
    if (onPick) onPick(p);
  });
  mask.addEventListener("click", function (e) { if (e.target === mask) mask.remove(); });

/* 会话批量清除 / 清空全部 */
function toggleBatchMode(force) {
  S.batchMode = (force === undefined) ? !S.batchMode : !!force;
  if (!S.batchMode) S.batchSel = {};
  renderSessions();
}
/* 会话批量清除 / 清空全部：确认后立即更新列表（乐观刷新），
   请求完成后按后端清单校正；失败时回滚并重新拉取。 */
function clearSessions(ids) {
  var targets = (ids ? ids.slice() : sortedSids()).filter(function (sid) {
    return !!S.sessions[sid];
  });
  if (!targets.length) { toast(t("chat.no_sessions"), "warn"); return; }
  var prevOrder = S.order.slice();
  var prevSessions = {};
  targets.forEach(function (sid) { prevSessions[sid] = S.sessions[sid]; });
  targets.forEach(function (sid) {
    delete S.sessions[sid];
    S.order = S.order.filter(function (x) { return x !== sid; });
  });
  if (S.sid && !S.sessions[S.sid]) {
    S.sid = sortedSids()[0] || null;
    if (S.sid) { openSession(S.sid); } else { renderAllMessages(null); }
  }
  toggleBatchMode(false); /* 立即重绘列表 + 退出批量态 */
  api("POST", "/api/sessions/clear", ids ? { ids: ids } : {}).then(function (r) {
    if (r && r.ok === false) {
      refreshSessions();
      toast(String(r.error || "failed"), "err");
      return;
    }
    var n = (r && r.count) || targets.length;
    var cleared = (r && r.cleared) || [];
    if (cleared.length !== targets.length) { refreshSessions(); }
    var label = ids ? t("chat.clear_selected") : t("chat.clear_all");
    toast(label + " (" + n + ")", "ok");
  }).catch(function (e) {
    Object.keys(prevSessions).forEach(function (sid) {
      if (!S.sessions[sid]) { S.sessions[sid] = prevSessions[sid]; }
    });
    S.order = prevOrder.filter(function (sid) { return !!S.sessions[sid]; });
    renderSessions();
    refreshSessions();
    toast(String(e.message || e), "err");
  });
}
/* 三视角（成品 / 框架 / 元框架）：仅 localStorage 记忆（ui.console_view 设置项已下线，
   不再写入设置库；设置页头开关本身保留） */
function setPerspective(persp) {
  if (persp !== "user" && persp !== "frame" && persp !== "meta") persp = "user";
  SET_PERSP = persp;
  try { localStorage.setItem("np_persp", persp); } catch (e) {}
  $$("#view-switch .vs-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-persp") === persp);
  });
  if (SET_LOADED) { renderSettings(); }
}

/* ============================================================
   init
   ============================================================ */
function pollStatus() {
  api("GET", "/api/status").then(function (r) {
    var tasks = (r && r.tasks) || [];
    var running = {};
    tasks.forEach(function (t) { if (t && t.status === "running" && t.session_id) running[t.session_id] = true; });
    var changed = false;
    Object.keys(S.sessions).forEach(function (sid) {
      var sess = S.sessions[sid];
      var nr = !!running[sid];
      if (sess.running !== nr) { sess.running = nr; changed = true; }
    });
    if (changed) renderSessions();
  }).catch(function () {});
}
function init() {
  themeInit();
  var l = null;
  try { l = localStorage.getItem("np_lang"); } catch (e) {}
  if (!l && window.FarStarsI18N) { l = FarStarsI18N.get(); }
  setLang(l || (((navigator.language || "").toLowerCase().indexOf("zh") === 0) ? "zh_CN" : "en"), false);
  var persp = null;
  try { persp = localStorage.getItem("np_persp"); } catch (e) {}
  if (persp === "frame" || persp === "meta" || persp === "user") { SET_PERSP = persp; }
  $$("#view-switch .vs-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-persp") === SET_PERSP);
  });
  window.addEventListener("storage", function (ev) {
    if (ev.key === "np_lang" && ev.newValue && ev.newValue !== LANG) { setLang(ev.newValue, false); }
  });
  bindUi();
  initDropZone();
  updateTokens();
  /* 模型列表单独异步拉取：远端端点可能较慢（数秒），不再阻塞启动关键路径
     （否则设置页 / 会话首屏会因 S.cfg 未就绪而缺失「已保存」等状态）。 */
  api("GET", "/api/models").then(function (r) {
    S.models = (r && r.models) || [];
    refreshModelOptions();
  }).catch(function () {});
  Promise.all([
    api("GET", "/api/config").catch(function () { return {}; }),
    api("GET", "/api/presets").catch(function () { return {}; }),
    api("GET", "/api/usage").catch(function () { return {}; }),
    refreshSessions()
  ]).then(function (res) {
    S.cfg = res[0] || {};
    S.presets = (res[1] && res[1].presets) || [];
    if (S.cfg.language && (S.cfg.language === "zh_CN" || S.cfg.language === "en")) {
      setLang(S.cfg.language, false);
    }
    var u = res[2] || {};
    S.tokens = (u.input_tokens || 0) + (u.output_tokens || 0);
    updateTokens();
    renderSettings();
    syncComposerFromConfig();
    if (S.cfg.vision_enabled) { $("#btn-vision").classList.add("on"); }
    var firstSid = sortedSids()[0];
    if (firstSid) { openSession(firstSid); } else { renderAllMessages(null); }
    api("GET", "/api/first_run").then(function (r) {
      if (r && r.first_run) {
        showView("settings");
        toast(LANG === "zh_CN" ? "首次使用：请先配置模型与 API 密钥。" : "First run: configure the model and API key first.", "warn");
      }
    }).catch(function () {});
  });
  /* renderer boot：marked + katex 从 CDN 加载；无网 / 失败静默回落原始字符串
     输出（不报错），并一次性计入审计。stats ticker：运行中刷新时间刻度。 */
  window.__norpRender = {
    state: function () {
      return { marked: !!REND.marked, katex: !!REND.katex, mode: REND.mode,
               settled: !!REND.settled, reported: !!REND.reported };
    },
    render: function (s) { return md(s); }
  };
  /* 测试 / 调试钩子：会话分组、排序与历史合并的纯函数（不参与业务逻辑） */
  window.__norpSession = {
    group: npSessionGroup,
    sorted: sortedSids,
    mergeAssistantRuns: mergeAssistantRuns,
    normalizeSegments: normalizeSegments
  };
  window.__norpSettingsDebug = function () {
    return { cfg: S.cfg, loaded: SET_LOADED, pending: SET_PENDING };
  };
  /* 测试 / 调试钩子：主题系统纯函数与状态（不参与业务逻辑） */
  window.__norpTheme = {
    state: function () { return THEME_STATE; },
    apply: function () { themeApply(); },
    toMarkdown: function () { return themeToMarkdown(themeFind(THEME_STATE.active)); },
    exportObject: function () { return themeExportObject(themeFind(THEME_STATE.active)); },
    fromMarkdown: function (s) { return themeFromMarkdown(s); },
    parseImport: function (s) { return themeParseImport(s); },
    validateCss: function (s) { return themeValidateCss(s); }
  };
  bootRenderer();
  ensureStatsTicker();
  connectSSE();
  setInterval(pollStatus, 15000);
}
init();


})();
</script>

</body>
</html>
